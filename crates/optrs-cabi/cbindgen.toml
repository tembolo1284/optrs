# crates/optrs-cabi/cbindgen.toml
language = "C"
header = "/* optrs - generated by cbindgen. Do not edit by hand. */"
include_guard = "OPTRS_H"
autogen_warning = "/* Regenerate with: cargo build -p optrs-cabi */"
cpp_compat = true
documentation = true
documentation_style = "doxy"
line_length = 88
tab_width = 4
style = "type"

[export]
prefix = ""
include = ["OptStatus", "OptKind", "OptStyle", "OptOption", "OptResult"]

[export.rename]
"OptStatus" = "opt_status_t"
"OptKind" = "opt_kind_t"
"OptStyle" = "opt_style_t"
"OptOption" = "opt_option_t"
"OptResult" = "opt_result_t"
"Pricer" = "opt_pricer_t"

[enum]
# Deliberately NOT prefix_with_name: that derives the prefix from the renamed
# type, giving OPT_STATUS_T_OK. Variants carry their own names instead.
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
