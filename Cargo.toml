# optrs/Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/optrs-core",
    "crates/optrs-cos",
    "crates/optrs-tree",
    "crates/optrs-fd",
    "crates/optrs-mc",
    "crates/optrs-engine",
    "crates/optrs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
optrs-core = { path = "crates/optrs-core" }
optrs-cos = { path = "crates/optrs-cos" }
optrs-tree = { path = "crates/optrs-tree" }
optrs-fd = { path = "crates/optrs-fd" }
optrs-mc = { path = "crates/optrs-mc" }
optrs-engine = { path = "crates/optrs-engine" }
num-complex = "0.4"

[profile.bench]
inherits = "release"
debug = true

# optrs/Cargo.toml  (replace the [profile.release] block)

[profile.release]
lto = "thin"
codegen-units = 1
# NOTE: deliberately NOT panic = "abort". The cdylib catches unwinds at the FFI
# boundary and converts them to error codes. With abort, a panic in the pricer
# would kill the host process — which for the Python binding means killing the
# interpreter, and for Excel means killing Excel.
