# Cargo.toml
[workspace]
resolver = "2"
members = [
    "crates/optrs-core",
    "crates/optrs-cos",
    "crates/optrs-tree",
    "crates/optrs-fd",
    "crates/optrs-mc",
    "crates/optrs-engine",
    "crates/optrs-cabi",
    "crates/optrs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
optrs-core = { path = "crates/optrs-core" }
optrs-cos = { path = "crates/optrs-cos" }
optrs-tree = { path = "crates/optrs-tree" }
optrs-fd = { path = "crates/optrs-fd" }
optrs-mc = { path = "crates/optrs-mc" }
optrs-engine = { path = "crates/optrs-engine" }
optrs-cabi = { path = "crates/optrs-cabi" }
num-complex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
