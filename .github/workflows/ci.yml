# .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # Build only: older toolchains often cannot compile dev-dependencies.
      - run: cargo build --workspace

  cabi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p optrs-cabi --release
      - name: header is up to date
        run: |
          test -f include/optrs.h
          git diff --exit-code -- include/optrs.h
      - name: C smoke test
        run: |
          cc -O2 -Wall -Wextra -Iinclude \
             crates/optrs-cabi/tests/smoke.c \
             -Ltarget/release -loptrs -lm \
             -Wl,-rpath,"$PWD/target/release" \
             -o smoke
          ./smoke

  python:
    needs: cabi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p optrs-cabi --release
      - run: pip install pytest cffi
      - run: pip install -e bindings/python
      - run: pytest bindings/python/tests -v
        env:
          OPTRS_LIB_DIR: ${{ github.workspace }}/target/release
      - name: Duffy batches
        run: python bindings/python/examples/duffy.py
        env:
          OPTRS_LIB_DIR: ${{ github.workspace }}/target/release
